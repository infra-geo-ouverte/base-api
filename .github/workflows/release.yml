name: Release Pipeline

on:
  push:
    branches:
      - main
      - next

permissions:
  id-token: write # Required for OIDC
  contents: write
  issues: write
  pull-requests: write
  # Allow workflows to publish to GitHub Pages when invoking reusable workflows
  pages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev --include=optional --no-audit --prefer-offline

      - name: Audit
        run: |
          npm audit --omit dev
          npm audit signatures
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
